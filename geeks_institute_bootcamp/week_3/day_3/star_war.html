<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <style>
    body {
    background-color: black;
    background-image: url(https://i.giphy.com/media/TxVVB6PfWMjE4/200.webp);
    font-family: 'Helvetica Neue';
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;    
    justify-content: center;  
}

main {
    border: solid 1px yellow;
    border-radius: 2%;
    display: flex;
    justify-content: center;  
    align-items: center;     
    height: 25rem;

}
section{
    width: 25rem;
    height: 25rem;
    display: flex;
    justify-content: center;  
    align-items: center;  
    color: white;   
}
        </style>
</head>
<body>
    <nav><h1>STAR WARS</h1></nav>
    <main>
         <section><div id="loader" style="display:none; margin-top:10px;">
            <i class="fa-solid fa-spinner fa-spin-pulse fa-4x"></i>
          
          </div>
          <div id="info"></div></section>
    </main>
    <button id="trigger">Find Someone</button>
</body>
<script>
const senction=document.getElementById("info")
const button = document.getElementById('trigger');
const loader = document.getElementById('loader');

  button.addEventListener('click', async () => {
    loader.style.display = 'block';   // show loader

    try {senction.innerHTML=""
        let index=Math.floor(Math.random() *83)
        let response=await fetch("https://www.swapi.tech/api/people/"+index)
        let data=await response.json()
        console.log(data)
        let h2=document.createElement("h2")
        let height=document.createElement("p")
        let gender=document.createElement("p")
        let birthday=document.createElement("p")
        let home=document.createElement("p")
        h2.textContent=data.result.properties.name
        height.textContent=data.result.properties.height
        gender.textContent=data.result.properties.gender
        birthday.textContent=data.result.properties["birth_year"]
        let homesite= await fetch(data.result.properties.homeworld)
        let homedata=await homesite.json()
        home.textContent=homedata.result.properties.name
        senction.appendChild(h2)
        senction.appendChild(height)
        senction.appendChild(gender)
        senction.appendChild(birthday)
        senction.appendChild(home)



    } finally {
      loader.style.display = 'none';  // hide loader
    }
  });
</script>
</html>
